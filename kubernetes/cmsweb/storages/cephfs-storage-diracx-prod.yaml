# Log share for the CMS DiracX production cluster (cmsdiracx-prod), CMSKUBERNETES-555.
# Manila share: diracx-share-prod (Meyrin CephFS, 22G), access: cephx cmsweb-auth.
# Mounted on vocms0755 at /cephfs/product/diracx-logs (it-puppet-hostgroup-vocmsweb, cephfs.pp).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: diracx-share
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 22G
  csi:
    driver: cephfs.manila.csi.openstack.org
    volumeHandle: 501f901c-9452-406e-8130-f070a8193224
    nodeStageSecretRef:
      name: os-trustee
      namespace: kube-system
    nodePublishSecretRef:
      name: os-trustee
      namespace: kube-system
    volumeAttributes:
      shareID: 501f901c-9452-406e-8130-f070a8193224
      shareAccessID: 2c84bdd3-ad4c-47c1-95cb-5e319e30a3f1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logs-cephfs-claim-prod-diracx
  namespace: diracx
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 22G
  storageClassName: ""
  volumeName: diracx-share
